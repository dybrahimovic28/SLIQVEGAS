<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCargo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#202329"/>
      <stop offset="50%" stop-color="#1B1E24"/>
      <stop offset="100%" stop-color="#272B32"/>
    </linearGradient>
    <pattern id="gridPatternCargo" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#414650" stroke-opacity="0.25" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGradCargo)"/>
  <rect width="800" height="1000" fill="url(#gridPatternCargo)"/>

  <!-- Subtle Outline Frame -->
  <rect x="24" y="24" width="752" height="952" rx="16" fill="none" stroke="#414650" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Top Brand Stamp -->
  <text x="400" y="80" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="6" fill="#B9BEC7">SLIQ VEGAS • CARGO UTILITY</text>
  <line x1="330" y1="96" x2="470" y2="96" stroke="#ff1e27" stroke-width="2"/>

  <!-- Vector Cargo Pants Silhouette in Steel Grey -->
  <g transform="translate(240, 160)" stroke="#5A606D" stroke-width="2" fill="#202329" stroke-linejoin="round" stroke-linecap="round">
    <!-- Waistband -->
    <rect x="50" y="30" width="220" height="35" rx="6" fill="#272B32" stroke="#5A606D"/>
    <!-- Belt Loops -->
    <line x1="75" y1="30" x2="75" y2="65" stroke="#717886" stroke-width="2.5"/>
    <line x1="160" y1="30" x2="160" y2="65" stroke="#717886" stroke-width="2.5"/>
    <line x1="245" y1="30" x2="245" y2="65" stroke="#717886" stroke-width="2.5"/>
    <!-- Main Pants Outlines -->
    <path d="M 50 65 L 35 480 L 120 490 L 155 240 L 165 240 L 200 490 L 285 480 L 270 65 Z" fill="#272B32"/>
    <!-- Inseam / Fly -->
    <line x1="160" y1="65" x2="160" y2="180" stroke="#717886" stroke-width="2"/>
    <!-- Side Cargo Pockets with Straps -->
    <rect x="20" y="220" width="55" height="90" rx="4" fill="#30353D" stroke="#717886"/>
    <path d="M 20 220 L 47 235 L 75 220 Z" fill="#272B32" stroke="#717886"/>
    <line x1="47" y1="235" x2="47" y2="310" stroke="#ff1e27" stroke-width="2"/>

    <rect x="245" y="220" width="55" height="90" rx="4" fill="#30353D" stroke="#717886"/>
    <path d="M 245 220 L 272 235 L 300 220 Z" fill="#272B32" stroke="#717886"/>
    <line x1="272" y1="235" x2="272" y2="310" stroke="#ff1e27" stroke-width="2"/>

    <!-- Knee Articulation Seams -->
    <path d="M 40 350 Q 80 365 125 350" fill="none" stroke="#5A606D" stroke-width="1.5"/>
    <path d="M 195 350 Q 240 365 280 350" fill="none" stroke="#5A606D" stroke-width="1.5"/>

    <!-- Cuffs -->
    <rect x="35" y="480" width="85" height="25" rx="4" fill="#272B32" stroke="#5A606D"/>
    <rect x="200" y="480" width="85" height="25" rx="4" fill="#272B32" stroke="#5A606D"/>
  </g>

  <!-- Status Pill Badge -->
  <g transform="translate(400, 755)">
    <rect x="-160" y="-24" width="320" height="48" rx="24" fill="#272B32" stroke="#414650" stroke-width="1.5"/>
    <circle cx="-120" cy="0" r="4" fill="#ff1e27"/>
    <text x="-95" y="5" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#F5F5F5">STUDIO SHOT IN PRODUCTION</text>
  </g>

  <!-- Editorial Info -->
  <text x="400" y="850" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="15" font-weight="600" fill="#F5F5F5" letter-spacing="3">EDITORIAL ARCHIVE</text>
  <text x="400" y="880" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="13" fill="#B9BEC7">Streetwear catalogue piece available for order on WhatsApp</text>
  <text x="400" y="930" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#ff1e27">SLIQ VEGAS • WEAR THE LIFESTYLE</text>
</svg>
