  <rect x="24" y="24" width="752" height="952" rx="16" fill="none" stroke="#414650" stroke-width="1.5" stroke-opacity="0.6"/>

  <text x="400" y="80" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="6" fill="#B9BEC7">SLIQ VEGAS • HOODIES &amp; SWEATS</text>
  <line x1="320" y1="96" x2="480" y2="96" stroke="#ff1e27" stroke-width="2"/>

