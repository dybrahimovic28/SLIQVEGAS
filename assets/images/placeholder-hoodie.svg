  <g transform="translate(180, 160)" stroke="#5A606D" stroke-width="2" fill="#202329" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 160 80 C 160 20, 220 10, 220 10 C 220 10, 280 20, 280 80 C 280 120, 250 140, 220 140 C 190 140, 160 120, 160 80 Z" fill="#272B32"/>
    <path d="M 190 70 C 190 35, 220 30, 220 30 C 220 30, 250 35, 250 70 C 250 110, 220 120, 220 120 C 220 120, 190 110, 190 70 Z" fill="#202329" stroke="#717886"/>
    <path d="M 210 130 Q 205 180 200 220" fill="none" stroke="#ff1e27" stroke-width="2"/>
    <path d="M 230 130 Q 235 180 240 220" fill="none" stroke="#ff1e27" stroke-width="2"/>
    <path d="M 160 110 L 40 190 L 80 340 L 130 310 L 130 460 L 310 460 L 310 310 L 360 340 L 400 190 L 280 110 Z" fill="#272B32"/>
    <path d="M 165 340 L 275 340 L 295 430 L 145 430 Z" fill="#30353D" stroke="#717886"/>
    <rect x="130" y="460" width="180" height="30" rx="4" fill="#30353D" stroke="#5A606D"/>
    <rect x="70" y="325" width="25" height="25" rx="3" transform="rotate(-30 80 340)" fill="#30353D" stroke="#5A606D"/>
    <rect x="345" y="325" width="25" height="25" rx="3" transform="rotate(30 360 340)" fill="#30353D" stroke="#5A606D"/>
    <circle cx="220" cy="220" r="28" fill="#1B1E24" stroke="#ff1e27" stroke-width="1.5"/>
    <text x="220" y="226" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="900" fill="#F5F5F5" letter-spacing="2" stroke="none">SV</text>
