<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradHoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#202329"/>
      <stop offset="50%" stop-color="#1B1E24"/>
      <stop offset="100%" stop-color="#272B32"/>
    </linearGradient>
    <pattern id="gridPatternHoodie" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#414650" stroke-opacity="0.25" stroke-width="1"/>
