<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradTee" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#202329"/>
      <stop offset="50%" stop-color="#1B1E24"/>
      <stop offset="100%" stop-color="#272B32"/>
    </linearGradient>
    <pattern id="gridPatternTee" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#414650" stroke-opacity="0.25" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#bgGradTee)"/>
  <rect width="800" height="1000" fill="url(#gridPatternTee)"/>
  <rect x="24" y="24" width="752" height="952" rx="16" fill="none" stroke="#414650" stroke-width="1.5" stroke-opacity="0.6"/>

  <text x="400" y="80" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="6" fill="#B9BEC7">SLIQ VEGAS • GRAPHIC TEES</text>
  <line x1="320" y1="96" x2="480" y2="96" stroke="#ff1e27" stroke-width="2"/>

  <!-- Vector T-Shirt Silhouette -->
  <g transform="translate(190, 170)" stroke="#5A606D" stroke-width="2" fill="#202329" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 140 40 Q 210 65 280 40 L 370 100 L 320 200 L 270 170 L 270 470 L 150 470 L 150 170 L 100 200 L 50 100 Z" fill="#272B32"/>
    <path d="M 140 40 Q 210 75 280 40" fill="none" stroke="#717886" stroke-width="3"/>
    <circle cx="210" cy="220" r="32" fill="#1B1E24" stroke="#ff1e27" stroke-width="1.5"/>
    <text x="210" y="227" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="900" fill="#F5F5F5" letter-spacing="2" stroke="none">SV</text>
    <rect x="150" y="460" width="120" height="20" rx="3" fill="#30353D" stroke="#5A606D"/>
  </g>

  <!-- Status Pill Badge -->
  <g transform="translate(400, 755)">
    <rect x="-160" y="-24" width="320" height="48" rx="24" fill="#272B32" stroke="#414650" stroke-width="1.5"/>
    <circle cx="-120" cy="0" r="4" fill="#ff1e27"/>
    <text x="-95" y="5" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#F5F5F5">STUDIO SHOT IN PRODUCTION</text>
  </g>

  <text x="400" y="850" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="15" font-weight="600" fill="#F5F5F5" letter-spacing="3">EDITORIAL ARCHIVE</text>
  <text x="400" y="880" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="13" fill="#B9BEC7">Streetwear catalogue piece available for order on WhatsApp</text>
  <text x="400" y="930" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#ff1e27">SLIQ VEGAS • WEAR THE LIFESTYLE</text>
</svg>
